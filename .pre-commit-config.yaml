# `pre-commit install` once; the .hf files committed are laid out as
# `heff fmt` lays them (test/errors/ holds files broken on purpose)
repos:
  - repo: local
    hooks:
      - id: heff-fmt
        name: heff fmt --check
        language: system
        entry: node output/heff.mjs fmt --check
        files: \.hf$
        exclude: ^test/errors/
