# `pre-commit install` once; the .hf files committed are laid out as
# `heff fmt` lays them (the tests' files are left as they are: the tests
# hold their offsets, and test/errors/ files broken on purpose)
repos:
  - repo: local
    hooks:
      - id: heff-fmt
        name: heff fmt --check
        language: system
        entry: output/heff fmt --check
        files: \.hf$
        exclude: ^test/
