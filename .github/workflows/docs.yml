# The documentation's site, made from docs/ (`npm run build` there) and
# published as the repository's GitHub Pages at each push to main that
# changes it: the library's API pages among them, made first by heff
# (`make api`, heff built by zig as CI builds it), so they are never
# behind the library.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - editors/vscode/syntaxes/**
      - lib/**
      - src/**
      - app/heff/**
      - boot/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # (the heff CI built last, with its caches, if there is one: built
      # again only as far as the source changed)
      - uses: actions/cache@v6
        with:
          path: |
            .heff
          key: heff-docs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            heff-docs-${{ runner.os }}-
            heff-${{ runner.os }}-
      - run: make build api
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
