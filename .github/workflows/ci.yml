name: CI

on:
  push:
  pull_request:

jobs:
  # the compiler, from its seed; every other job runs this one
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/upload-artifact@v7
        with:
          name: heff
          path: |
            output/heff.mjs
            output/heff.raw.mjs

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            run: node test/surface.mjs && node test/format.mjs && node test/cache.mjs && node test/cli.mjs && node test/app-run.mjs && node test/node-run.mjs && npm run examples
          - name: lsp
            run: node test/lsp.mjs
          - name: compile-check-js
            run: node test/compile-check-js.mjs 60 1
          - name: fixpoint
            run: node test/gen-fixpoint.mjs
          - name: golden check
            run: node test/golden.mjs check
          - name: golden explain
            run: node test/golden.mjs explain
          - name: golden eval
            run: node test/golden.mjs eval
          - name: golden type-at
            run: node test/golden.mjs type-at
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # (the dependencies only: the compiler is the build job's)
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: heff
          path: output
      - run: ${{ matrix.run }}
