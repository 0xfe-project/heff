name: CI

on:
  push:
  pull_request:

jobs:
  # the compiler (`make build`, `zig build`: zig and make, no Node.js),
  # from the heff an earlier run built, kept with its cache and the parts
  # zig built, .heff/out/heff.o/ (each checked by what it is made of, the
  # heff by the seed it comes of, so an old one is never wrong, only less
  # of use; zig's own cache, which setup-zig keeps, knows a C file by its
  # inode and time, so a part written again, as in every checkout, it
  # builds again); every other job runs this one
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - uses: actions/cache@v6
        with:
          # (the heff built, .heff/out/heff, with the compiler's cache,
          # .heff/vN/, and the parts built, .heff/out/heff.o/; the build
          # job runs no tests, so there is nothing else under .heff/)
          path: |
            .heff
          key: heff-${{ runner.os }}-${{ github.sha }}
          restore-keys: heff-${{ runner.os }}-
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: heff
          include-hidden-files: true
          path: |
            .heff/out/heff
            .heff/out/heff.d

  # the seed, which the build uses only where there is no heff of it:
  # still able to build heff, and the heff it builds the same (by zig
  # and make, no Node.js)
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      # (the parts zig built in the seed's runs before, the seed's among
      # them, and no heff: each kept by what it is made of, so that a
      # part as it was is not built again, and a seed that cannot build
      # heff still cannot)
      - uses: actions/cache@v6
        with:
          path: |
            .heff/out/heff.o
          key: heff-seed-${{ runner.os }}-${{ github.sha }}
          restore-keys: heff-seed-${{ runner.os }}-
      - run: make build-seed
      - run: make test-fixpoint

  # a group of test/run.mjs each (Node.js, by which the tests run, until
  # #55), the fixpoint (by zig) and the formatting
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [compiler, lsp, backends, fixpoint, asan, fmt]
    name: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
      - uses: actions/download-artifact@v8
        with:
          name: heff
          path: .heff/out
      # (an artifact keeps no mode)
      - run: chmod +x .heff/out/heff
      # (the parts the asan tests built in the runs before, each
      # kept by what it is made of: a part as it was is not built again)
      - if: matrix.group == 'asan'
        uses: actions/cache@v6
        with:
          path: |
            .heff/ref/native-asan.o
          key: asan-${{ runner.os }}-${{ github.sha }}
          restore-keys: asan-${{ runner.os }}-
      # (as .pre-commit-config.yaml: the tests' files are left as they
      # are, their offsets and broken ones the tests')
      - if: matrix.group == 'fmt'
        run: make fmt-check
      - if: matrix.group != 'fmt'
        run: make test-${{ matrix.group }}
