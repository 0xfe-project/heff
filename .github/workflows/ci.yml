name: CI

on:
  push:
  pull_request:

jobs:
  # the compiler, from its seed (scripts/build.mjs); every other job runs
  # this one
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: heff
          path: |
            output/heff
            output/heff.d

  # a group of test/run.mjs each
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [compiler, lsp, backends, fixpoint, asan, fmt]
    name: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
      - uses: actions/download-artifact@v8
        with:
          name: heff
          path: output
      # (an artifact keeps no mode)
      - run: chmod +x output/heff
      # (as .pre-commit-config.yaml: the tests' files are left as they
      # are, their offsets and broken ones the tests')
      - if: matrix.group == 'fmt'
        run: output/heff fmt --check $(git ls-files '*.hf' ':!test/')
      - if: matrix.group != 'fmt'
        run: node test/run.mjs ${{ matrix.group }}
