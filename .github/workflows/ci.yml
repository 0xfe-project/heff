name: CI

on:
  push:
  pull_request:

jobs:
  # the compiler (scripts/build.mjs), from the heff an earlier run built,
  # kept with its cache (each checked by what it is made of, the heff by
  # the seed it comes of, so an old one is never wrong, only less of
  # use); zig keeps the files it built (setup-zig); every other job runs
  # this one
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
      - uses: actions/cache@v6
        with:
          # (the heff built, .heff/out/heff, with the compiler's cache,
          # .heff/vN/; the build job runs no tests, so there is nothing
          # else under .heff/)
          path: |
            .heff
          key: heff-${{ runner.os }}-${{ github.sha }}
          restore-keys: heff-${{ runner.os }}-
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: heff
          include-hidden-files: true
          path: |
            .heff/out/heff
            .heff/out/heff.d

  # the seed, which the build uses only where there is no heff of it:
  # still able to build heff, and the heff it builds the same
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
      - run: node scripts/build.mjs --seed
      - run: node test/run.mjs fixpoint

  # a group of test/run.mjs each
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [compiler, lsp, backends, fixpoint, asan, fmt]
    name: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
      - uses: actions/download-artifact@v8
        with:
          name: heff
          path: .heff/out
      # (an artifact keeps no mode)
      - run: chmod +x .heff/out/heff
      # (as .pre-commit-config.yaml: the tests' files are left as they
      # are, their offsets and broken ones the tests')
      - if: matrix.group == 'fmt'
        run: .heff/out/heff fmt --check $(git ls-files '*.hf' ':!test/')
      - if: matrix.group != 'fmt'
        run: node test/run.mjs ${{ matrix.group }}
