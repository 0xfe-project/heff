name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # jsdiff, the one dependency (a failed expectation's difference)
      - run: npm ci

      # the compiler built from its seed (boot/heff.mjs), then every gate:
      # the tests' expectations, the language server, the compiled
      # programs against the interpreter, the golden texts, and the
      # fixpoint -- what the compiler compiles itself to is itself
      - run: npm test

      - name: Examples
        run: npm run examples

      - name: VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
