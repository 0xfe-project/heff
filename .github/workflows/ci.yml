name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # PureScript and spago, from package.json
      - run: npm ci

      # the PureScript packages spago downloads
      - uses: actions/cache@v4
        with:
          path: .spago
          key: spago-${{ hashFiles('spago.lock') }}

      - run: npm test

      - name: Examples
        run: npm run examples

      - name: VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
