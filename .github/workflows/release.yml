name: Release

# A tag `vX.Y.Z` makes a GitHub release of that version: heff for each
# platform (`heff-X.Y.Z-PLATFORM.tar.gz`, `.zip` for Windows, and their
# SHA256SUMS; made by `make release`, through C, by zig for every
# platform from one runner, then tried on each there is a runner for),
# and the VS Code extension (`heff-X.Y.Z.vsix`).  The tag must name the version package.hf is for
# and the extension's package.json says, which is what `heff` reports
# itself to be.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The tag is the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/.*heff = "\(.*\)".*/\1/p' package.hf)
          ext=$(node -p "require('./editors/vscode/package.json').version")
          for f in "package.hf:$got" "editors/vscode/package.json:$ext"; do
            if [ "${f#*:}" != "$v" ]; then
              echo "::error::${f%%:*} says ${f#*:}, the tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # (the compiler from its seed, which must compile itself to itself)
      - run: make build
      - run: make test-fixpoint
      # (each platform's archive, in
      # .heff/out/release/)
      - run: make release
      - name: The VS Code extension
        run: make vsix
      - name: What is released
        run: |
          mkdir dist
          cp .heff/out/release/* editors/vscode/heff-*.vsix dist/
          cd dist && sha256sum -c SHA256SUMS && ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # each platform's program tried where it runs: checking, formatting,
  # compiling to an ES module (loaded by Node.js), and running a program
  # (`heff run` builds it by zig, then runs it in its place)
  try:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64, exe: heff }
          - { os: macos-latest, platform: macos-arm64, exe: heff }
          - { os: windows-latest, platform: windows-x64, exe: heff.exe }
    runs-on: ${{ matrix.os }}
    name: try ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Unpack
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "${{ matrix.platform }}" in
            windows-*) unzip -q "heff-$v-${{ matrix.platform }}.zip" ;;
            *) tar xzf "heff-$v-${{ matrix.platform }}.tar.gz" ;;
          esac
          echo "HEFF=$PWD/heff-$v-${{ matrix.platform }}/bin/${{ matrix.exe }}" >> "$GITHUB_ENV"
      # (away from the checkout: heff's own package is no project of an
      # installed heff's)
      - name: Away
        run: |
          mkdir -p "$RUNNER_TEMP/try"
          cp test/programs/bigs.hf bench/pure.hf "$RUNNER_TEMP/try/"
      - working-directory: ${{ runner.temp }}/try
        run: '"$HEFF" check bigs.hf'
      - working-directory: ${{ runner.temp }}/try
        run: '"$HEFF" fmt --check bigs.hf'
      - working-directory: ${{ runner.temp }}/try
        run: 'mkdir -p ref && "$HEFF" compile bigs.hf ref/bigs.mjs --backend=esm && node -e "import(\"./ref/bigs.mjs\")"'
      - working-directory: ${{ runner.temp }}/try
        run: test "$("$HEFF" run pure.hf | tr -d '\r')" = 1000000

  release:
    needs: try
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            heff-*.tar.gz heff-*.zip SHA256SUMS heff-*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "heff ${GITHUB_REF_NAME#v}" \
            --generate-notes
