name: Release

# A tag `vX.Y.Z` makes a GitHub release of that version: the compiler,
# ready to run (`heff-X.Y.Z.tar.gz`), and the VS Code extension
# (`heff-X.Y.Z.vsix`).  The tag must name the version package.json and
# the extension's package.json say, which is what `heff` reports itself
# to be.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag is the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in package.json editors/vscode/package.json; do
            got=$(node -p "require('./$f').version")
            if [ "$got" != "$v" ]; then
              echo "::error::$f says $got, the tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "VERSION=$v" >> "$GITHUB_ENV"
      # (builds the compiler from its seed, as every CI run does)
      - run: npm ci
      - run: npm test
      # The compiler with what it reads beside itself: its version
      # (package.json) and its library (lib/).  It needs nothing installed
      # but Node.js: `node heff-X.Y.Z/output/heff.mjs`.
      - name: The compiler
        run: |
          d="heff-$VERSION"
          mkdir -p "$d/output"
          cp output/heff.mjs "$d/output/"
          cp -R package.json README.md lib licenses "$d/"
          tar czf "$d.tar.gz" "$d"
      - name: The VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "heff-$VERSION.tar.gz" \
            "editors/vscode/heff-$VERSION.vsix" \
            --title "heff $VERSION" \
            --generate-notes
