name: VS Code extension

on:
  push:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode.yml"
      - "Makefile"
  pull_request:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode.yml"
      - "Makefile"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: make vsix
