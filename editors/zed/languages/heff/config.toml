name = "heff"
grammar = "heff"
path_suffixes = ["hf"]
line_comments = ["-- "]
block_comment = ["{- ", " -}"]
tab_size = 2
autoclose_before = ";,=)]}"
brackets = [
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["'", "/"]
increase_indent_pattern = "(\\S.*\\bwhere|\\b(of|do|let)|=|->)\\s*$"
decrease_indent_pattern = "^\\s*(in|then|else)\\b"
