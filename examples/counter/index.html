<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter — heff</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .note { color: #666; font-size: 0.9rem; }
  #hg-app, .app { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; }
  button { font: inherit; padding: 0.2rem 0.8rem; }
  input { font: inherit; padding: 0.2rem 0.4rem; }
  @media (prefers-color-scheme: dark) { body { background: #1b1b1b; color: #ddd; } .note { color: #999; } #hg-app, .app { border-color: #444; } }
</style>
</head>
<body>
<h1>Counter</h1>
<p class="note">examples/counter/counter.hg, compiled by <code>hg app</code>: the paragraph and the button are made by the program.</p>
<div id="hg-app"></div>
<!-- (a plain script, not a module: it imports nothing, and a module does not load from file://) -->
<script src="counter.js"></script>
</body>
</html>
